[package]
name = "playr"
version = "0.1.0"
edition = "2024"
description = "Light, fast media player: video files, audio files and internet radio, on pure-Rust decoders"

[dependencies]
# AES-128 for encrypted HLS segments; already built as part of rustls-rustcrypto.
aes = "0.9.4"
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
oxideav-mpeg4video = "0.1.10"
rfd = "0.18.0"
rust_h264 = "0.6.1"
rust_h265 = "0.4.1"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-opus-rs = "0.1.1"
# TLS without ring (which compiles C and assembly): rustls with a pure-Rust crypto provider.
rustls-rustcrypto = "0.1.0-pre.0"
quick-xml = "0.41.0"
# The window handle, which "To tray" hides and shows through Win32.
raw-window-handle = "0.6"
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
# Thumbnails in the YouTube browser.
zune-jpeg = "0.5.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
# The notification-area icon of "To tray" (no default features: those are Linux GTK).
tray-icon = { version = "0.27.0", default-features = false }

# Tests that make a real window to hide to the tray.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[build-dependencies]
# Embeds assets/playr.ico into playr.exe; does nothing when the target is not Windows.
embed-resource = "3.0.12"

# Software video decoding is unusable unoptimised, so dependencies are always built with -O3;
# only this crate's own code stays at the debug level in dev and test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
